name: Deploy Website To Development

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "lambda_functions/**"
      - "docs/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Read backend endpoints from the crest-api-dev stack
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name crest-api-dev --query "Stacks[0].Outputs" --output json)
          for pair in IdentifyUrl:VITE_API_IDENTIFY_URL ZonalStatsUrl:VITE_API_ZONAL_STATS_URL UploadShapeUrl:VITE_API_UPLOAD_SHAPE_URL ShareReadUrl:VITE_API_SHARE_READ_URL ShareWriteUrl:VITE_API_SHARE_WRITE_URL; do
            key=${pair%%:*}; var=${pair##*:}
            value=$(echo "$outputs" | jq -r ".[] | select(.OutputKey==\"$key\") | .OutputValue")
            if [ -z "$value" ] || [ "$value" = "null" ]; then echo "missing stack output $key"; exit 1; fi
            echo "$var=$value" >> "$GITHUB_ENV"
          done

      - name: Build
        env:
          VITE_AGOL_API_KEY: ${{ secrets.AGOL_DEV_KEY }}
          VITE_CREST_DATA_CHANNEL: dev
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy static site to S3 bucket for development
        run: aws s3 sync ./dist/ s3://crest.nemac.org --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1WM3CCMHRFQOS --paths "/*"
