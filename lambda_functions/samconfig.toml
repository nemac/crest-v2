version = 0.1

[dev.deploy.parameters]
stack_name = "crest-api-dev"
region = "us-east-1"
s3_bucket = "nfwf-tool-cloudformation"
s3_prefix = "crest-api/dev"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=dev SharePrefix=dev/"
confirm_changeset = false
fail_on_empty_changeset = false

# Not armed: the v1 stack named crest-api-prod still exists and must be deleted before this section is ever used.
[prod.deploy.parameters]
stack_name = "crest-api-prod"
region = "us-east-1"
s3_bucket = "nfwf-tool-cloudformation"
s3_prefix = "crest-api/prod"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=prod SharePrefix="
confirm_changeset = true
fail_on_empty_changeset = false
