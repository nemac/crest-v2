line-length = 160
target-version = "py313"
extend-exclude = [".aws-sam"]

[lint]
# Defaults plus bugbear (B), imports (I), pyupgrade (UP), warnings (W) and the bandit security checks (S).
select = ["E", "F", "W", "I", "B", "UP", "S"]
# subprocess is always called with an argument list, and GDAL/aws are found on PATH by design.
ignore = ["S603", "S607"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S314"]
# Parses the XML that gdalbuildvrt just wrote, not untrusted input.
"tools/build_vrt.py" = ["S314"]
# Operator tool: the URLs come from the command line.
"tools/parity_check.py" = ["S310"]
